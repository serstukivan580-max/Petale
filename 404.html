  *{margin:0; padding:0; box-sizing:border-box;}
  html, body{height:100%;}

  /* хмари у фіксованому шарі з обрізанням — не розширюють сторінку на телефоні */

  .bank{position:absolute; left:-10vw; bottom:-8vw; width:120vw; max-width:none; height:auto;}

  h1{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:clamp(32px, 5vw, 46px); line-height:1.1; color:#3c1f2c; margin:10px 0 14px;}
  p{font-size:16px; line-height:1.65; color:#6f5660; margin-bottom:30px;}
  .btn{display:inline-block; padding:16px 32px; border-radius:999px; font-weight:700; color:#fff; text-decoration:none; background:linear-gradient(135deg, #6b3a52, #3c1f2c); box-shadow:0 18px 38px -16px rgba(60,31,44,.7); transition:transform .3s ease;}
